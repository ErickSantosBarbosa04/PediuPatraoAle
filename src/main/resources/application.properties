# Configure MONGODB_URI to use a managed MongoDB instance. The default is local development.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# The initial admin is created only when ADMIN_INITIAL_PASSWORD is supplied.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
