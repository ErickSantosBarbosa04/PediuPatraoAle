<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Produtos</h2>
        <button type="button" class="btn btn-primary" id="novoProduto">
            <i class="bi bi-plus-lg me-1"></i>Novo Produto
        </button>
    </div>
    <div id="mensagemProduto" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm mb-4" id="formularioProdutoCard">
        <div class="card-header fw-semibold" id="tituloFormularioProduto">Cadastrar produto</div>
        <div class="card-body">
            <form id="produtoForm" class="row g-3">
                <input type="hidden" id="produtoId">
                <div class="col-md-4">
                    <label for="nomeProduto" class="form-label">Nome</label>
                    <input type="text" id="nomeProduto" class="form-control" required maxlength="100">
                </div>
                <div class="col-md-3">
                    <label for="tipoProduto" class="form-label">Tipo</label>
                    <select id="tipoProduto" class="form-select" required>
                        <option value="">Selecione</option><option>Pizza</option><option>Lanche</option>
                        <option>Bebida</option><option>Porção</option><option>Adicional</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="precoProduto" class="form-label">Preço (R$)</label>
                    <input type="number" id="precoProduto" class="form-control" min="0.01" step="0.01" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input type="checkbox" id="ativoProduto" class="form-check-input" checked>
                        <label for="ativoProduto" class="form-check-label">Produto ativo</label>
                    </div>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" id="limparProduto">Limpar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th>Nome</th><th>Tipo</th><th>Preço</th><th>Ativo</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td></tr>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco == null ? '—' : 'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${produto.ativo ? 'Sim' : 'Não'}"></td>
                        <td class="text-end text-nowrap">
                            <button type="button" class="btn btn-sm btn-outline-primary editar-produto"
                                    th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo}">Editar</button>
                            <button type="button" class="btn btn-sm btn-outline-danger excluir-produto" th:attr="data-id=${produto.id}">Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (() => {
            const form = document.getElementById('produtoForm');
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const headers = {'Content-Type': 'application/json'};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
            const mensagem = document.getElementById('mensagemProduto');

            function avisar(texto, erro = false) {
                mensagem.textContent = texto;
                mensagem.className = `alert ${erro ? 'alert-danger' : 'alert-success'}`;
            }
            function limpar() {
                form.reset();
                document.getElementById('produtoId').value = '';
                document.getElementById('ativoProduto').checked = true;
                document.getElementById('tituloFormularioProduto').textContent = 'Cadastrar produto';
            }

            document.getElementById('novoProduto').addEventListener('click', () => {
                limpar();
                document.getElementById('formularioProdutoCard').scrollIntoView({behavior: 'smooth'});
            });
            document.getElementById('limparProduto').addEventListener('click', limpar);

            form.addEventListener('submit', async event => {
                event.preventDefault();
                const id = document.getElementById('produtoId').value;
                const produto = {
                    nome: document.getElementById('nomeProduto').value.trim(),
                    tipo: document.getElementById('tipoProduto').value,
                    preco: Number(document.getElementById('precoProduto').value),
                    ativo: document.getElementById('ativoProduto').checked
                };
                try {
                    const response = await fetch(id ? `/api/produtos/${encodeURIComponent(id)}` : '/api/produtos', {
                        method: id ? 'PUT' : 'POST', headers, body: JSON.stringify(produto)
                    });
                    if (!response.ok) throw new Error('Não foi possível salvar o produto.');
                    window.location.reload();
                } catch (erro) { avisar(erro.message, true); }
            });

            document.addEventListener('click', async event => {
                const editar = event.target.closest('.editar-produto');
                const excluir = event.target.closest('.excluir-produto');
                if (editar) {
                    document.getElementById('produtoId').value = editar.dataset.id;
                    document.getElementById('nomeProduto').value = editar.dataset.nome;
                    document.getElementById('tipoProduto').value = editar.dataset.tipo;
                    document.getElementById('precoProduto').value = editar.dataset.preco;
                    document.getElementById('ativoProduto').checked = editar.dataset.ativo === 'true';
                    document.getElementById('tituloFormularioProduto').textContent = 'Editar produto';
                    document.getElementById('formularioProdutoCard').scrollIntoView({behavior: 'smooth'});
                } else if (excluir && confirm('Deseja excluir este produto?')) {
                    try {
                        const response = await fetch(`/api/produtos/${encodeURIComponent(excluir.dataset.id)}`, {method: 'DELETE', headers});
                        if (!response.ok) throw new Error('Não foi possível excluir o produto.');
                        window.location.reload();
                    } catch (erro) { avisar(erro.message, true); }
                }
            });
        })();
    </script>
</div>
</body>
</html>
