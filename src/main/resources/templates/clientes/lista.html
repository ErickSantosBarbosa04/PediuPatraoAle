<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes</h2>
        <a th:if="${isAtendente}" th:href="@{/clientes/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Cliente
        </a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="4" class="text-center text-muted py-5">Nenhum cliente cadastrado.</td>
                    </tr>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.telefone}"></td>
                        <td th:text="${cliente.enderecoCompleto}"></td>
                        <td class="text-end">
                            <a th:if="${isAtendente}" th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:if="${isAdmin}" th:action="@{/clientes/deletar/{id}(id=${cliente.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Deseja remover este cliente?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                            <span th:if="${!isAtendente and !isAdmin}" class="text-muted">Consulta</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
