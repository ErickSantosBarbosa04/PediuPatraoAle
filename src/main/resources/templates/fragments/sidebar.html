<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar">
    <div id="sidebar">
        <div class="sidebar-brand"><img th:src="@{/images/logo.svg}" alt="PediuPatrão"></div>
        <ul class="nav flex-column px-2">
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/}"><i class="bi bi-house-fill me-2"></i>Home</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/clientes}"><i class="bi bi-person-raised-hand me-2"></i>Clientes</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/pedidos}"><i class="bi bi-bag-fill me-2"></i>Pedidos</a></li>
            <li th:if="${isAdmin or isGerente}" class="sidebar-section-label d-none d-md-block mt-3">Gestão</li>
            <li class="nav-item" th:if="${isAdmin or isGerente}">
                <a class="nav-link sidebar-link" th:href="@{/produtos}"><i class="bi bi-boxes me-2"></i>Produtos</a>
            </li>
            <li class="nav-item" th:if="${isAdmin}">
                <a class="nav-link sidebar-link" th:href="@{/usuarios}"><i class="bi bi-people-fill me-2"></i>Usuários</a>
            </li>
            <li class="nav-item" th:if="${isAdmin or isGerente}">
                <a class="nav-link sidebar-link" th:href="@{/auditoria}"><i class="bi bi-journal-text me-2"></i>Auditoria</a>
            </li>
        </ul>
        <div class="sidebar-footer d-none d-md-block">
            <div class="small mb-2" th:text="${usuarioAtual + ' · ' + perfilAtual}"></div>
            <form th:action="@{/logout}" method="post" class="mb-2">
                <button class="btn btn-sm btn-outline-light w-100" type="submit">Sair</button>
            </form>
            <i class="bi bi-circle-fill text-success me-1" style="font-size:0.5rem"></i>Sistema online
        </div>
    </div>
</div>
<style>
    #sidebar{display:flex;flex-direction:column;height:100vh;background:linear-gradient(180deg,#1e2330 0%,#252d3d 100%);border-right:1px solid rgba(255,255,255,.06)}
    .sidebar-brand{padding:1rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:.5rem}
    .sidebar-brand img{width:100%;max-width:200px;display:block;margin:auto}
    .sidebar-link{color:rgba(255,255,255,.65)!important;border-radius:8px;padding:.55rem .85rem;margin-bottom:2px;font-size:.9rem}
    .sidebar-link:hover{background:rgba(255,255,255,.08);color:#fff!important}
    .sidebar-section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);padding:.2rem 1rem .4rem}
    .sidebar-footer{margin-top:auto;padding:1rem 1.2rem;font-size:.78rem;color:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.06)}
</style>
</body>
</html>
